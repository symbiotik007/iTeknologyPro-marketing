<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px; height: 1080px;
    background: linear-gradient(160deg, #2563EB 0%, #1030A0 100%);
    font-family: "Segoe UI", Arial, sans-serif;
    overflow: hidden;
    position: relative;
  }
  .logo {
    position: absolute;
    top: 130px; left: 50%;
    transform: translateX(-50%);
    width: 150px; height: 150px;
    border-radius: 50%;
    background: white;
    padding: 6px;
  }
  .cta-headline {
    position: absolute;
    top: 380px; left: 90px; right: 90px;
    text-align: center;
    color: #ffffff;
    font-size: 66px;
    font-weight: 800;
    line-height: 1.2;
  }
  .cta-button {
    position: absolute;
    top: 620px; left: 50%;
    transform: translateX(-50%);
    background: #ffffff;
    color: #1743A8;
    font-size: 38px;
    font-weight: 800;
    padding: 30px 64px;
    border-radius: 100px;
    white-space: nowrap;
  }
  .handle {
    position: absolute;
    bottom: 90px; left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.85);
    font-size: 30px;
    font-weight: 600;
  }
</style>
</head>
<body>
  <img class="logo" src="LOGO_DATA_URI" />
  <div class="cta-headline">CTA_HEADLINE_HTML</div>
  <div class="cta-button">CTA_BUTTON_TEXT</div>
  <div class="handle">HANDLE_TEXT</div>
</body>
</html>

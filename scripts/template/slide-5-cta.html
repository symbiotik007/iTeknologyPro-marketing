<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px; height: 1080px;
    background: linear-gradient(160deg, #2563EB 0%, #1030A0 100%);
    font-family: "Segoe UI", Arial, sans-serif;
    overflow: hidden;
    position: relative;
  }
  .logo { position: absolute; top: 50px; left: 50%; transform: translateX(-50%); width: 100px; height: 100px; border-radius: 50%; background: white; padding: 4px; }

  .mockup-stage { position: absolute; top: 160px; left: 50%; transform: translateX(-50%); width: 460px; height: 300px; }
  .mockup-card { position: absolute; inset: 0; background: #ffffff; border-radius: 24px; box-shadow: 0 20px 44px -14px rgba(6,12,40,0.35); overflow: hidden; }
  .mockup-card img { width: 100%; height: 100%; object-fit: cover; }

  .result { position: absolute; top: 500px; left: 80px; right: 80px; text-align: center; color: #ffffff; font-size: 36px; font-weight: 600; line-height: 1.3; }
  .cta-headline { position: absolute; top: 630px; left: 80px; right: 80px; text-align: center; color: #ffffff; font-size: 54px; font-weight: 800; line-height: 1.15; }
  .cta-button { position: absolute; top: 850px; left: 50%; transform: translateX(-50%); background: #ffffff; color: #1743A8; font-size: 32px; font-weight: 800; padding: 24px 52px; border-radius: 100px; white-space: nowrap; }
  .handle { position: absolute; bottom: 55px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.85); font-size: 24px; font-weight: 600; }
</style>
</head>
<body>
  <img class="logo" src="LOGO_DATA_URI" />
  <div class="mockup-stage">
    <div class="mockup-card">ILLUSTRATION_IMG</div>
  </div>
  <div class="result">RESULT_TEXT</div>
  <div class="cta-headline">CTA_HEADLINE_HTML</div>
  <div class="cta-button">CTA_BUTTON_TEXT</div>
  <div class="handle">HANDLE_TEXT</div>
</body>
</html>

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px; height: 1080px;
    background: #F7F9FC;
    font-family: "Segoe UI", Arial, sans-serif;
    overflow: hidden;
    position: relative;
  }
  .eyebrow {
    position: absolute;
    top: 90px; left: 90px;
    color: #2563EB;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 2px;
  }
  .title {
    position: absolute;
    top: 140px; left: 90px; right: 90px;
    color: #0B1024;
    font-size: 56px;
    font-weight: 800;
    line-height: 1.15;
  }
  .list {
    position: absolute;
    top: 380px; left: 90px; right: 90px;
    display: flex;
    flex-direction: column;
    gap: 34px;
  }
  .item {
    display: flex;
    align-items: flex-start;
    gap: 24px;
    background: #ffffff;
    border: 1px solid #E4E9F5;
    box-shadow: 0 4px 14px rgba(11,16,36,0.06);
    border-radius: 20px;
    padding: 28px 32px;
  }
  .item svg { width: 40px; height: 40px; flex-shrink: 0; margin-top: 4px; }
  .item span {
    color: #2B3352;
    font-size: 34px;
    font-weight: 500;
    line-height: 1.3;
  }
  .logo {
    position: absolute;
    bottom: 60px; right: 90px;
    width: 70px; height: 70px;
    border-radius: 50%;
  }
</style>
</head>
<body>
  <div class="eyebrow">EL PROBLEMA</div>
  <div class="title">TITLE_HTML</div>
  <div class="list">
    ITEMS_HTML
  </div>
  <img class="logo" src="LOGO_DATA_URI" />
</body>
</html>

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px; height: 1080px;
    background: #FAFBFF;
    font-family: "Segoe UI", Arial, sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* fondo con personalidad: blobs suaves + onda */
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.5;
  }
  .blob.b1 { width: 460px; height: 460px; background: #DCE6FF; top: -160px; right: -160px; }
  .blob.b2 { width: 380px; height: 380px; background: #EAF0FF; bottom: -140px; left: -140px; }

  .wave {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 8px;
    background: linear-gradient(90deg, #2563EB 0%, #60A5FA 50%, #2563EB 100%);
  }

  .logo {
    position: absolute;
    top: 64px; left: 80px;
    height: 34px;
    width: auto;
  }

  .trust {
    position: absolute;
    top: 70px; right: 80px;
    color: #5B6685;
    font-size: 20px;
    font-weight: 600;
    background: rgba(37,99,235,0.06);
    padding: 8px 18px;
    border-radius: 100px;
  }

  .content {
    position: absolute;
    top: 148px; left: 80px; right: 80px;
  }

  .headline {
    color: #0B1024;
    font-size: 72px;
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -1px;
  }
  .headline .accent { color: #2563EB; }

  .subtitle {
    margin-top: 18px;
    color: #5B6685;
    font-size: 30px;
    font-weight: 400;
    max-width: 720px;
  }

  /* mockup grande, con profundidad (sombra + tarjeta flotante) */
  .mockup-stage {
    position: absolute;
    top: 390px; left: 50%;
    transform: translateX(-50%);
    width: 760px; height: 430px;
  }
  .mockup-shadow {
    position: absolute;
    inset: 30px 40px -10px 40px;
    background: radial-gradient(ellipse at center, rgba(37,99,235,0.20) 0%, transparent 70%);
    filter: blur(20px);
  }
  .mockup-card {
    position: absolute;
    inset: 0;
    background: #ffffff;
    border-radius: 32px;
    box-shadow: 0 30px 60px -20px rgba(11,16,36,0.25), 0 0 0 1px rgba(37,99,235,0.08);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .mockup-card img { width: 100%; height: 100%; object-fit: cover; }
  .mockup-card svg { width: 320px; height: 320px; }

  /* tarjeta flotante decorativa, esquina del mockup */
  .float-chip {
    position: absolute;
    top: -22px; right: 46px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 12px 28px -8px rgba(11,16,36,0.18);
    padding: 14px 22px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 22px;
    font-weight: 700;
    color: #0B1024;
  }
  .float-chip .dot { width: 12px; height: 12px; border-radius: 50%; background: #22C55E; }

  .benefits {
    position: absolute;
    top: 850px; left: 80px; right: 80px;
    display: flex;
    gap: 36px;
  }
  .benefit {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 24px;
    font-weight: 600;
    color: #2B3352;
  }
  .benefit .check {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: #2563EB;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .benefit .check svg { width: 14px; height: 14px; }

  .cta {
    position: absolute;
    top: 930px; left: 80px; right: 80px;
    background: linear-gradient(135deg, #2563EB, #1743A8);
    color: white;
    font-size: 34px;
    font-weight: 700;
    text-align: center;
    padding: 26px 0;
    border-radius: 100px;
    box-shadow: 0 16px 32px -10px rgba(37,99,235,0.45);
  }
</style>
</head>
<body>
  <div class="wave"></div>
  <div class="blob b1"></div>
  <div class="blob b2"></div>

  <img class="logo" src="LOGO_DATA_URI" />
  <div class="trust">TRUST_TEXT</div>

  <div class="content">
    <div class="headline">HEADLINE_HTML</div>
    <div class="subtitle">SUBTITLE_TEXT</div>
  </div>

  <div class="mockup-stage">
    <div class="mockup-shadow"></div>
    <div class="mockup-card">ICON_SVG</div>
    <div class="float-chip"><span class="dot"></span>FLOAT_TEXT</div>
  </div>

  <div class="benefits">
    BENEFITS_HTML
  </div>

  <div class="cta">CTA_TEXT</div>
</body>
</html>

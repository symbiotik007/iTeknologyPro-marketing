<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px; height: 1080px;
    background: #FAFBFF;
    font-family: "Segoe UI", Arial, sans-serif;
    overflow: hidden;
    position: relative;
  }
  .eyebrow { position: absolute; top: 80px; left: 80px; color: #2563EB; font-size: 26px; font-weight: 700; letter-spacing: 2px; }
  .title { position: absolute; top: 128px; left: 80px; right: 80px; color: #0B1024; font-size: 52px; font-weight: 800; line-height: 1.15; }

  .mockup-stage { position: absolute; top: 300px; left: 50%; transform: translateX(-50%); width: 560px; height: 400px; }
  .mockup-shadow { position: absolute; inset: 24px 30px -10px 30px; background: radial-gradient(ellipse at center, rgba(37,99,235,0.20) 0%, transparent 70%); filter: blur(20px); }
  .mockup-card { position: absolute; inset: 0; background: #ffffff; border-radius: 28px; box-shadow: 0 24px 50px -18px rgba(11,16,36,0.22), 0 0 0 1px rgba(37,99,235,0.08); overflow: hidden; }
  .mockup-card img { width: 100%; height: 100%; object-fit: cover; }

  .float-chip {
    position: absolute; top: 320px; right: 130px;
    background: #ffffff; border-radius: 16px; box-shadow: 0 12px 28px -8px rgba(11,16,36,0.18);
    padding: 12px 20px; display: flex; align-items: center; gap: 10px;
    font-size: 20px; font-weight: 700; color: #0B1024;
  }
  .float-chip .dot { width: 10px; height: 10px; border-radius: 50%; background: #2563EB; }

  .list { position: absolute; top: 750px; left: 80px; right: 80px; display: flex; flex-direction: column; gap: 22px; }
  .item { display: flex; align-items: center; gap: 20px; }
  .check { width: 44px; height: 44px; border-radius: 50%; background: #2563EB; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .check svg { width: 22px; height: 22px; }
  .item span { color: #0B1024; font-size: 32px; font-weight: 600; }

  .logo { position: absolute; bottom: 55px; right: 80px; height: 26px; opacity: 0.9; }
</style>
</head>
<body>
  <div class="eyebrow">LA SOLUCIÓN</div>
  <div class="title">TITLE_HTML</div>

  <div class="mockup-stage">
    <div class="mockup-shadow"></div>
    <div class="mockup-card">ILLUSTRATION_IMG</div>
  </div>
  <div class="float-chip"><span class="dot"></span>CHIP_TEXT</div>

  <div class="list">
    ITEMS_HTML
  </div>

  <img class="logo" src="LOGO_DATA_URI" />
</body>
</html>

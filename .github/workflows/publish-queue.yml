name: Publicar queue (aprobación Telegram) 3x/día

on:
  # schedule DESACTIVADO — publicación automática apagada. Reactivar
  # descomentando el bloque de abajo.
  # schedule:
  #   # 14:30 UTC ≈ 9:30 a.m. Colombia
  #   - cron: "30 14 * * *"
  #   # 19:00 UTC ≈ 2:00 p.m. Colombia
  #   - cron: "0 19 * * *"
  #   # 00:00 UTC ≈ 7:00 p.m. Colombia (mismo día, UTC-5 sin horario de verano)
  #   - cron: "0 0 * * *"
  workflow_dispatch: {} # botón manual "Run workflow" en la pestaña Actions

permissions:
  contents: write # para commitear meta.json/telegram-state.json actualizados

concurrency:
  group: social-post
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar git para los commits del bot
        run: |
          git config user.name "iteknology-bot"
          git config user.email "bot@iteknology.local"

      - name: Publicar queue (o fallback a rotación vieja)
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/publish-queue.mjs
